<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Duplicate Tab Guard</title>
<style>
  body { font: 16px system-ui, sans-serif; max-width: 30em; margin: 12vh auto; padding: 0 1em; color: #1f2937; }
  button { font: inherit; padding: .5em 1.1em; margin-right: .5em; border-radius: 6px; border: 1px solid #2563eb; cursor: pointer; }
  #yes { background: #2563eb; color: #fff; }
  #no { background: #fff; color: #2563eb; }
  @media (prefers-color-scheme: dark) { body { background: #111827; color: #e5e7eb; } #no { background: #111827; color: #93c5fd; border-color: #93c5fd; } }
</style>
</head>
<body>
<h1>Duplicate Tab Guard is on</h1>
<p>From now on, opening a page you already have open switches to the existing tab instead.</p>
<p id="msg">Checking your open tabs...</p>
<p id="buttons" hidden>
  <button id="yes">Close duplicates now</button>
  <button id="no">Keep them</button>
</p>
<p><small>You can clean up again any time by clicking the toolbar icon. Pinned tabs are never closed.</small></p>
<script src="welcome.js"></script>
</body>
</html>
